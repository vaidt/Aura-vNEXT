name: baseline

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    name: governance invariants and M0 gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependency installation step: the governance baseline is standard library
      # only (ADR-0002), and so is M0 (ADR-0004). Adding one would pre-empt the open
      # dependency policy (OQ-4).

      - name: Validate repository structure
        run: python3 tools/validate_structure.py

      - name: Validate module transfer register
        run: python3 tools/validate_register.py

      # P0-02 / P0-03: the committed canonical bytes and digests must match the
      # implementation. A mismatch is a breaking change to the canonical form, not a
      # prompt to regenerate.
      - name: Check M0 conformance fixtures for drift
        run: python3 tools/build_m0_fixtures.py --check

      - name: Run the full test suite
        run: python3 -m unittest discover -s tests -v

      # The verifier must work from the package alone. This runs it in a directory
      # holding only core/ and app/verifier/, isolated, with the network disabled.
      # The producer is excluded: an environment containing it could not show that
      # verification does not need it.
      - name: Independent verification
        run: python3 tools/independence_check.py

      # The product loop, executed rather than described: an application event is
      # recorded by `aura record` in one environment, and the resulting package is
      # verified in another that holds no producer. Also asserts the package the
      # command line produces is the accepted reference package, byte for byte.
      - name: Product loop end to end
        run: python3 tools/product_loop_check.py

      - name: Verify the reference evidence package
        run: python3 -m app.aura verify evidence/examples/aura-evidence-loan-001
